<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coli Verify</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Verification screen -->
    <div class="container" id="loginScreen">
        <h1>Coli Verify</h1>
        <p>Enter your verification code to continue.</p>

        <input
            type="text"
            id="codeInput"
            placeholder="Enter code"
            autocomplete="off"
        >

        <button id="joinButton">Verify & Join Chat</button>

        <p id="errorMessage"></p>
    </div>


    <!-- Username and color screen -->
    <div class="container" id="usernameScreen" style="display: none;">

        <h1>Choose your username</h1>

        <p>This is how you'll appear in chat.</p>

        <input
            type="text"
            id="usernameInput"
            placeholder="Enter username"
            maxlength="30"
            autocomplete="off"
        >

        <p>Choose your chat color:</p>

        <input
            type="color"
            id="colorInput"
            value="#4285F4"
        >

        <button id="usernameButton">Enter Chat</button>

        <p id="usernameError"></p>

    </div>


    <!-- Chat application -->
    <div class="appContainer" id="chatScreen" style="display: none;">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="sidebarHeader">
                <h2>Coli Chat</h2>
            </div>

            <nav class="sidebarNav">

                <button
                    class="sidebarTab active"
                    id="chatTab"
                    data-page="chatPage"
                >
                    Chat
                </button>

                <button
                    class="sidebarTab"
                    id="profileTab"
                    data-page="profilePage"
                >
                    Profile
                </button>

                <button
                    class="sidebarTab"
                    id="settingsTab"
                    data-page="settingsPage"
                >
                    Settings
                </button>

            </nav>

        </aside>


        <!-- Main content -->
        <main class="mainContent">

            <!-- CHAT PAGE -->
            <section
                class="appPage activePage"
                id="chatPage"
            >

                <div class="pageHeader">
                    <h1>Chat</h1>
                </div>

                <div id="messages"></div>

                <div class="messageBox">

                    <input
                        type="text"
                        id="messageInput"
                        placeholder="Type a message..."
                        autocomplete="off"
                    >

                    <button id="sendButton">
                        Send
                    </button>

                </div>

            </section>


            <!-- PROFILE PAGE -->
            <section
                class="appPage"
                id="profilePage"
            >

                <div class="pageHeader">
                    <h1>Profile</h1>
                </div>

                <div class="settingsCard">

                    <h2>Your Profile</h2>

                    <label for="profileUsername">
                        Username
                    </label>

                    <input
                        type="text"
                        id="profileUsername"
                        maxlength="30"
                        autocomplete="off"
                    >

                    <label for="profileColor">
                        Chat Color
                    </label>

                    <div class="colorRow">

                        <input
                            type="color"
                            id="profileColor"
                            value="#4285F4"
                        >

                        <span id="profileColorValue">
                            #4285F4
                        </span>

                    </div>

                    <button
                        class="primaryButton"
                        id="saveProfileButton"
                    >
                        Save Profile
                    </button>

                    <p
                        class="pageMessage"
                        id="profileMessage"
                    ></p>

                </div>

            </section>


            <!-- SETTINGS PAGE -->
            <section
                class="appPage"
                id="settingsPage"
            >

                <div class="pageHeader">
                    <h1>Settings</h1>
                </div>

                <div class="settingsCard">

                    <h2>Account</h2>

                    <p>
                        Your login session is saved on this device
                        for up to 4 days.
                    </p>

                    <button
                        class="dangerButton"
                        id="logoutButton"
                    >
                        Log Out
                    </button>

                </div>

            </section>

        </main>

    </div>


    <script type="module" src="script.js"></script>

</body>
</html>
